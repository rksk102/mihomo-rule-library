target-version = "py313"
line-length = 120

[lint]
select = ["E4", "E5", "E9", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003 把中文全角标点当"歧义字符"，本项目所有文案都是中文，全部豁免
ignore = ["RUF001", "RUF002", "RUF003"]

[lint.per-file-ignores]
# gen_readme 的静态段落是 Markdown 表格，行宽由渲染需求决定，不能按 120 折断
"scripts/gen_readme.py" = ["E501"]
