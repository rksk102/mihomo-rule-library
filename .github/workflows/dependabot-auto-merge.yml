name: "Dependabot 自动合并"

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  auto-merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 合并 Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          case "$HEAD_BRANCH" in
            dependabot/*) ;;
            *) echo "非 Dependabot 分支（$HEAD_BRANCH），跳过"; exit 0 ;;
          esac

          pr="$PR_NUMBER"
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" \
                   --state open --json number --jq '.[0].number // empty')
          fi
          if [ -z "$pr" ]; then
            echo "未找到对应的开放 PR，跳过"; exit 0
          fi

          read -r author state < <(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" \
            --json author,state --jq '"\(.author.login) \(.state)"')
          if [ "$author" != "app/dependabot" ] && [ "$author" != "dependabot[bot]" ]; then
            echo "PR #$pr 作者为 $author，非 Dependabot，跳过"; exit 0
          fi
          if [ "$state" != "OPEN" ]; then
            echo "PR #$pr 状态为 $state，无需合并"; exit 0
          fi

          echo "CI 已通过，合并 PR #$pr"
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --merge
