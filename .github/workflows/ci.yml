name: "CI"

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-generated-artifacts:
    name: "禁止提交生成产物"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 检查生成产物是否被跟踪
        run: |
          set -euo pipefail
          tracked=$(git ls-files 'merged-rules/*' 'merged-rules-mrs/*' 'rulesets/*' 'logs/*' '.cache/*')
          if [ -n "$tracked" ]; then
            echo "::error::生成产物不得进入 git（merged-rules/ merged-rules-mrs/ rulesets/ logs/ .cache/）。"
            echo "$tracked" | head -20
            exit 1
          fi
          echo "OK: 产物未被跟踪"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Python 环境
        uses: ./.github/actions/setup-python-env
      - run: ruff check scripts tests
      - name: zizmor（工作流安全审计）
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity medium .github/

  workflows-lint:
    name: "工作流静态检查"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667  # v1.7.12
        with:
          args: -color

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Python 环境
        uses: ./.github/actions/setup-python-env
      - name: pytest（覆盖率门禁 ≥70%）
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python -m pytest tests/ -q --cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=70

  kernel-smoke:
    name: "内核冒烟"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Python 环境
        uses: ./.github/actions/setup-python-env
      - name: 计算内核缓存键
        id: kernel-key
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          from config_loader import get

          raw = "|".join(
              str(get("mihomo", key, default=""))
              for key in ("pinned_version", "kernel_sha256", "kernel_sha256_arm64")
          )
          print("key=" + hashlib.sha256(raw.encode("utf-8")).hexdigest())
          print("path=" + get("mihomo", "kernel_cache_path", default=".cache/mihomo-kernel"))
          PY
      - name: 恢复 Mihomo 内核缓存
        id: kernel-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.kernel-key.outputs.path }}
          key: mihomo-${{ runner.os }}-${{ runner.arch }}-${{ steps.kernel-key.outputs.key }}
          restore-keys: |
            mihomo-${{ runner.os }}-${{ runner.arch }}-${{ steps.kernel-key.outputs.key }}-
            mihomo-${{ runner.os }}-${{ runner.arch }}-
      - name: 校验当前内核可运行
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python scripts/convert_mrs.py --verify-current-kernel
      - name: 用缓存内核转换最小 ipcidr 输入
        env:
          KERNEL: ${{ steps.kernel-key.outputs.path }}/mihomo
        run: |
          set -euo pipefail
          TMP_DIR="${RUNNER_TEMP}/kernel-smoke"
          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"
          printf '1.1.1.0/24\n172.16.0.0/12\n' > "$TMP_DIR/ipcidr.txt"
          "$KERNEL" convert-ruleset ipcidr text "$TMP_DIR/ipcidr.txt" "$TMP_DIR/ipcidr.mrs"
          test -s "$TMP_DIR/ipcidr.mrs"
          echo "OK: ipcidr 转换产物非空（$(stat -c%s "$TMP_DIR/ipcidr.mrs") 字节）"

  dependency-review:
    name: "依赖审查"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
