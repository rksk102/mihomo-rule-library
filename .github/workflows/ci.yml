name: "CI"

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'config.yaml'
      - 'requirements*.txt'
      - '.ruff.toml'
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'config.yaml'
      - 'requirements*.txt'
      - '.ruff.toml'
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: ruff check scripts

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -q
