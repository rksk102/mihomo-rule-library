name: "CI"

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'config.yaml'
      - 'sources.urls'
      - 'requirements*.txt'
      - 'requirements*.lock'
      - '.ruff.toml'
      - '.coderabbit.yaml'
      - '.gitignore'
      - '.github/dependabot.yml'
      - 'state/**'
      - 'merged-rules*/**'
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'config.yaml'
      - 'sources.urls'
      - 'requirements*.txt'
      - 'requirements*.lock'
      - '.ruff.toml'
      - '.coderabbit.yaml'
      - '.gitignore'
      - '.github/dependabot.yml'
      - 'state/**'
      - 'merged-rules*/**'
      - '.github/workflows/**'
      - '.github/actions/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-generated-artifacts:
    name: "禁止提交生成产物"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 检查生成产物是否被跟踪
        run: |
          set -euo pipefail
          tracked=$(git ls-files 'merged-rules/*' 'merged-rules-mrs/*' 'rulesets/*' 'logs/*' '.cache/*' || true)
          if [ -n "$tracked" ]; then
            echo "::error::生成产物不得进入 git（merged-rules/ merged-rules-mrs/ rulesets/ logs/ .cache/）。"
            echo "$tracked" | head -20
            exit 1
          fi
          echo "OK: 产物未被跟踪"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: ruff check scripts tests
      - name: zizmor（工作流安全审计）
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity medium .github/

  workflows-lint:
    name: "工作流静态检查"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667  # v1.7.12
        with:
          args: -color

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: pytest（覆盖率门禁 ≥70%）
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python -m pytest tests/ -q --cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=70

  dependency-review:
    name: "依赖审查"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
