name: "规则构建流水线"

on:
  schedule:
    - cron: '0 19 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      strict_mode:
        description: '严格模式（任何源失败则终止）'
        type: boolean
        default: false
      skip_release:
        description: '跳过 Release 发布'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: default-branch-write
  cancel-in-progress: false

jobs:
  sync-rules:
    name: "1. 同步清洗"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Python 环境
        # 暂不使用 $/ 自仓库语法：CI 钉扎的 actionlint 1.7.12 尚不支持
        uses: ./.github/actions/setup-python-env
      - name: 运行同步
        env:
          STRICT_MODE: ${{ inputs.strict_mode }}
          PYTHONPATH: ${{ github.workspace }}/scripts
          GH_TOKEN: ${{ github.token }}
        run: python scripts/main.py
      - name: 上传 rulesets 产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rulesets
          path: rulesets/
          retention-days: 1
          if-no-files-found: error

  merge-rules:
    name: "2. 合并规则"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: sync-rules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Python 环境
        uses: ./.github/actions/setup-python-env
      - name: 下载 rulesets 产物
        id: dl-rulesets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        continue-on-error: true
        with:
          name: rulesets
          path: rulesets/
          digest-mismatch: error
      - name: 运行合并
        id: merge
        if: steps.dl-rulesets.outcome == 'success'
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python scripts/merger.py
      - name: 上传 merged-rules 产物
        if: steps.dl-rulesets.outcome == 'success' && steps.merge.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: merged-rules
          path: merged-rules/
          retention-days: 1
          if-no-files-found: error

  convert-mrs:
    name: "3. 转换 MRS"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: merge-rules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Python 环境
        uses: ./.github/actions/setup-python-env
      - name: 清空旧产物
        run: rm -rf merged-rules merged-rules-mrs
      - name: 下载 merged-rules 产物
        id: dl-merged
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        continue-on-error: true
        with:
          name: merged-rules
          path: merged-rules/
          digest-mismatch: error
      - name: 缓存 Mihomo 内核（恢复）
        if: steps.dl-merged.outcome == 'success'
        id: kernel-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/mihomo-kernel
          key: mihomo-${{ runner.os }}-${{ hashFiles('config.yaml') }}
          restore-keys: |
            mihomo-${{ runner.os }}-${{ hashFiles('config.yaml') }}-
            mihomo-${{ runner.os }}-
      - name: 转换规则集
        if: steps.dl-merged.outcome == 'success'
        id: convert
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python -u scripts/convert_mrs.py
      - name: 缓存 Mihomo 内核（保存）
        if: steps.dl-merged.outcome == 'success' && steps.convert.outcome == 'success' && steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/mihomo-kernel
          key: mihomo-${{ runner.os }}-${{ hashFiles('config.yaml') }}
      - name: 上传 merged-rules-mrs 产物
        if: steps.dl-merged.outcome == 'success' && steps.convert.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: merged-rules-mrs
          path: merged-rules-mrs/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: "4. 发布"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: convert-mrs
    if: github.ref == 'refs/heads/main'
    permissions:
        contents: write  # 需要推送 artifacts 分支、README 与 state/release.sha256
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 # zizmor: ignore[artipacked] 需要凭据推送 README/state
      - name: 安装 Python 环境
        uses: ./.github/actions/setup-python-env
      - name: 清空旧产物
        run: rm -rf merged-rules merged-rules-mrs
      - name: 下载 rulesets 产物（提供产物清单基线）
        id: dl-rulesets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: rulesets
          path: rulesets/
          digest-mismatch: error
      - name: 下载 merged-rules 产物
        id: dl-merged
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        continue-on-error: true
        with:
          name: merged-rules
          path: merged-rules/
          digest-mismatch: error
      - name: 下载 merged-rules-mrs 产物
        id: dl-mrs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        continue-on-error: true
        with:
          name: merged-rules-mrs
          path: merged-rules-mrs/
          digest-mismatch: error
      - name: 生成 README
        if: steps.dl-merged.outcome == 'success' && steps.dl-mrs.outcome == 'success'
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python scripts/gen_readme.py
      - name: 产物一致性预检
        if: steps.dl-merged.outcome == 'success' && steps.dl-mrs.outcome == 'success'
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python scripts/release_handler.py --verify-only
      - name: 发布规则产物到 artifacts 分支
        if: steps.dl-merged.outcome == 'success' && steps.dl-mrs.outcome == 'success'
        env:
          ARTIFACTS_BRANCH: artifacts
        run: |
          set -euo pipefail
          # 独立 worktree：orphan 提交会清空工作区，不能在主工作区执行
          WT="$(mktemp -d)"
          git worktree add --detach "$WT"
          (
            cd "$WT"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout --orphan "${ARTIFACTS_BRANCH}"
            git rm -rf . >/dev/null 2>&1 || true
            cp -r "${GITHUB_WORKSPACE}/merged-rules" "${GITHUB_WORKSPACE}/merged-rules-mrs" .
            printf 'merged-rules/\nmerged-rules-mrs/\n' > .gitignore
            git add -f merged-rules merged-rules-mrs .gitignore
            git commit -m "chore: 规则产物 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git fetch origin "${ARTIFACTS_BRANCH}" 2>/dev/null || true
            git push --force origin "HEAD:${ARTIFACTS_BRANCH}"
          )
          git worktree remove --force "$WT"
      - name: 提交 README 与发布状态
        if: steps.dl-merged.outcome == 'success' && steps.dl-mrs.outcome == 'success'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 主工作区始终停留在触发分支上（产物提交已在独立 worktree 完成），
          # 无需再 checkout，避免把刚生成的 README.md 覆盖回旧版本。
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README 无变化"
          else
            git commit -m "docs: 自动更新 README [skip ci]"
            git pull --rebase origin "${REF_NAME}"
            git push
          fi
      - name: 发布 Release
        if: ${{ inputs.skip_release != true && steps.dl-merged.outcome == 'success' && steps.dl-mrs.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python scripts/release_handler.py
      - name: 提交发布状态
        if: ${{ inputs.skip_release != true && steps.dl-merged.outcome == 'success' && steps.dl-mrs.outcome == 'success' }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git add state/release.sha256
          if git diff --cached --quiet; then
            echo "发布状态无变化"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: 更新发布哈希 [skip ci]"
            git pull --rebase origin "${REF_NAME}"
            git push
          fi
      - name: 校验制品下载完整性
        if: steps.dl-merged.outcome != 'success' || steps.dl-mrs.outcome != 'success'
        env:
          MERGED_OUTCOME: ${{ steps.dl-merged.outcome }}
          MERGED_CONCLUSION: ${{ steps.dl-merged.conclusion }}
          MRS_OUTCOME: ${{ steps.dl-mrs.outcome }}
          MRS_CONCLUSION: ${{ steps.dl-mrs.conclusion }}
        run: |
          echo "::error::制品下载不完整: merged-rules(outcome=${MERGED_OUTCOME} conclusion=${MERGED_CONCLUSION}) merged-rules-mrs(outcome=${MRS_OUTCOME} conclusion=${MRS_CONCLUSION}) run_id=${{ github.run_id }}"
          exit 1
