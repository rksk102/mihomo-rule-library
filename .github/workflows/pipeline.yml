name: "规则构建流水线"

on:
  schedule:
    - cron: '0 19 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      skip_release:
        description: '跳过 Release 发布'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: default-branch-write
  cancel-in-progress: false

jobs:
  build:
    name: "1. 同步/合并/转换"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Python 环境
        # 暂不使用 $/ 自仓库语法：CI 钉扎的 actionlint 1.7.12 尚不支持
        uses: ./.github/actions/setup-python-env
      - name: 运行同步
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
          GH_TOKEN: ${{ github.token }}
        run: python scripts/main.py
      - name: 上传 rulesets 清单（供发布校验）
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rulesets
          path: rulesets/products.manifest
          retention-days: 1
          if-no-files-found: error
      - name: 运行合并
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python scripts/merger.py
      - name: 上传 merged-rules 产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: merged-rules
          path: merged-rules/
          retention-days: 1
          if-no-files-found: error
      - name: 计算内核缓存键
        id: kernel-key
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          from config_loader import get

          raw = "|".join(
              str(get("mihomo", key, default=""))
              for key in ("pinned_version", "kernel_sha256", "kernel_sha256_arm64")
          )
          print("key=" + hashlib.sha256(raw.encode("utf-8")).hexdigest())
          print("path=" + get("mihomo", "kernel_cache_path", default=".cache/mihomo-kernel"))
          PY
      - name: 缓存 Mihomo 内核（恢复）
        id: kernel-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.kernel-key.outputs.path }}
          key: mihomo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.kernel-key.outputs.key }}
          restore-keys: |
            mihomo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.kernel-key.outputs.key }}-
            mihomo-${{ runner.os }}-${{ runner.arch }}-${{ steps.kernel-key.outputs.key }}
            mihomo-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: 转换规则集
        id: convert
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python -u scripts/convert_mrs.py
      - name: 缓存 Mihomo 内核（保存）
        if: steps.convert.outcome == 'success' && steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.kernel-key.outputs.path }}
          key: mihomo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.kernel-key.outputs.key }}
      - name: 上传 merged-rules-mrs 产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: merged-rules-mrs
          path: merged-rules-mrs/
          retention-days: 1
          if-no-files-found: error
      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: logs-build
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: "2. 发布"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: build
    if: (github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    outputs:
      release_outcome: ${{ steps.release.outcome }}
    permissions:
      contents: write  # 需要推送 artifacts 分支、README 与 state/release.sha256
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 # zizmor: ignore[artipacked] 需要凭据推送 README/state
      - name: 安装 Python 环境
        uses: ./.github/actions/setup-python-env
      - name: 清空旧产物
        run: rm -rf merged-rules merged-rules-mrs
      - name: 下载 rulesets 产物（提供产物清单基线）
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: rulesets
          path: rulesets/
          digest-mismatch: error
      - name: 下载 merged-rules 产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: merged-rules
          path: merged-rules/
          digest-mismatch: error
      - name: 下载 merged-rules-mrs 产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: merged-rules-mrs
          path: merged-rules-mrs/
          digest-mismatch: error
      - name: 检查产物变化
        id: product-state
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
          ARTIFACTS_BRANCH: artifacts
          ARTIFACTS_HASH_MARKER: .product-sha256
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT=$(python scripts/release_handler.py --print-hash)
          echo "current_hash=$CURRENT" >> "$GITHUB_OUTPUT"
          LAST=$(cat state/release.sha256 2>/dev/null || true)
          DETECT=$(python -c "from config_loader import get; print('true' if get('behavior', 'release_change_detection', default=True) else 'false')")
          if [ "$DETECT" = "true" ] && [ -n "$LAST" ] && [ "$CURRENT" = "$LAST" ]; then
            # --needs-publish 可能先打印 GH CLI 警告；取最后一行布尔值
            NEEDS=$(python scripts/release_handler.py --needs-publish | tail -n 1)
            set +e
            git ls-remote --exit-code --heads origin "${ARTIFACTS_BRANCH}" >/dev/null 2>&1
            RC=$?
            set -e
            if [ "$RC" -ne 0 ] && [ "$RC" -ne 2 ]; then
              echo "::error::无法查询 ${ARTIFACTS_BRANCH} 分支（git ls-remote 退出码 $RC）"
              exit "$RC"
            fi
            # 退出码 2 才表示分支不存在；其余非零值（网络/鉴权）已在上面中止
            if [ "$NEEDS" = "true" ] || [ "$RC" -eq 2 ]; then
              # 内容未变但 Release 需自愈或分支缺失：推送产物并强制补发 Release
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "force_release=true" >> "$GITHUB_OUTPUT"
            else
              if ! git fetch --no-tags --depth=1 origin "${ARTIFACTS_BRANCH}"; then
                echo "::error::无法读取 ${ARTIFACTS_BRANCH} 分支，拒绝跳过产物发布"
                exit 1
              fi
              if ! MARKER_ENTRY=$(git ls-tree FETCH_HEAD -- "${ARTIFACTS_HASH_MARKER}"); then
                echo "::error::无法读取 ${ARTIFACTS_BRANCH} 分支树，拒绝跳过产物发布"
                exit 1
              fi
              if [ -z "$MARKER_ENTRY" ]; then
                echo "artifacts 分支缺少产品哈希标记，重推"
                echo "changed=true" >> "$GITHUB_OUTPUT"
              elif [[ "$MARKER_ENTRY" != "100644 blob "*$'\t'"${ARTIFACTS_HASH_MARKER}" ]]; then
                echo "artifacts 分支产品哈希标记类型不可信，重推"
                echo "changed=true" >> "$GITHUB_OUTPUT"
              else
                if ! ARTIFACTS_HASH=$(git show "FETCH_HEAD:${ARTIFACTS_HASH_MARKER}"); then
                  echo "::error::无法读取 artifacts 产品哈希标记，拒绝跳过产物发布"
                  exit 1
                fi
                if [[ ! "$ARTIFACTS_HASH" =~ ^[0-9a-f]{64}\|[0-9a-f]{64}\|[0-9]+\|[0-9]+$ ]]; then
                  echo "artifacts 分支产品哈希标记格式不可信，重推"
                  echo "changed=true" >> "$GITHUB_OUTPUT"
                elif [ "$ARTIFACTS_HASH" != "$CURRENT" ]; then
                  echo "artifacts 分支产品哈希标记与当前产品不一致，重推"
                  echo "changed=true" >> "$GITHUB_OUTPUT"
                else
                  echo "changed=false" >> "$GITHUB_OUTPUT"
                fi
              fi
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 生成 README
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
          ARTIFACTS_BRANCH: artifacts
          FORCE_RELEASE: ${{ steps.product-state.outputs.force_release }}
        run: python scripts/gen_readme.py
      - name: 产物一致性预检
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python scripts/release_handler.py --verify-only
      - name: 发布规则产物到 artifacts 分支
        if: steps.product-state.outputs.changed == 'true'
        env:
          ARTIFACTS_BRANCH: artifacts
          ARTIFACTS_HASH_MARKER: .product-sha256
          CURRENT_HASH: ${{ steps.product-state.outputs.current_hash }}
        run: |
          set -euo pipefail
          # 独立 worktree：orphan 提交会清空工作区，不能在主工作区执行
          WT="$(mktemp -d)"
          git worktree add --detach "$WT"
          (
            cd "$WT"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout --orphan "${ARTIFACTS_BRANCH}"
            git rm -rf . >/dev/null 2>&1 || true
            cp -r "${GITHUB_WORKSPACE}/merged-rules" "${GITHUB_WORKSPACE}/merged-rules-mrs" .
            printf 'merged-rules/\nmerged-rules-mrs/\n' > .gitignore
            printf '%s\n' "$CURRENT_HASH" > "${ARTIFACTS_HASH_MARKER}"
            git add -f merged-rules merged-rules-mrs .gitignore "${ARTIFACTS_HASH_MARKER}"
            git commit -m "chore: 规则产物 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git fetch origin "${ARTIFACTS_BRANCH}" 2>/dev/null || true
            git push --force origin "HEAD:${ARTIFACTS_BRANCH}"
          )
          git worktree remove --force "$WT"
      - name: 发布 Release
        id: release
        if: ${{ inputs.skip_release != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/scripts
          FORCE_RELEASE: ${{ steps.product-state.outputs.force_release }}
        run: python scripts/release_handler.py
      - name: 提交 README 与发布状态
        if: ${{ steps.release.outcome == 'success' || inputs.skip_release == true }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 主工作区始终停留在触发分支上（产物提交已在独立 worktree 完成），
          # 无需再 checkout，避免把刚生成的 README.md 覆盖回旧版本。
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if [ -f state/release.sha256 ]; then
            git add state/release.sha256
          fi
          if git diff --cached --quiet; then
            echo "README/发布状态无变化"
          else
            git commit -m "chore: 更新发布哈希 [skip ci]"
            git pull --rebase origin "${REF_NAME}"
            git push
          fi
      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: logs-publish
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

  notify-on-failure:
    name: "3. 失败告警"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [build, publish]
    if: always() && (github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    permissions:
      issues: write
      actions: read  # 读取失败 job/step 明细
    steps:
      - name: 失败时评论/创建固定告警 Issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          R_BUILD: ${{ needs.build.result }}
          R_PUBLISH: ${{ needs.publish.result }}
          R_RELEASE: ${{ needs.publish.outputs.release_outcome }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          RESULTS="build=$R_BUILD publish=$R_PUBLISH release=$R_RELEASE"
          FAILED_STEPS=$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs" \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name + ": " + ([.steps[] | select(.conclusion == "failure") | .name] | join(", "))] | join("\n")' \
            2>/dev/null || true)
          if [ -z "$FAILED_STEPS" ]; then
            FAILED_STEPS="未知（未能读取 job 明细）"
          fi
          echo "本轮结果: $RESULTS"
          TITLE="[告警] 规则构建流水线失败"
          NUMBER=$(gh issue list --state open --limit 1000 --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\") | .number] | first // empty")
          if ! echo "$R_BUILD $R_PUBLISH" | grep -qE "failure|cancelled"; then
            if [ "$R_RELEASE" != "success" ]; then
              echo "Release 步骤未成功（$R_RELEASE），保留告警 Issue"
              exit 0
            fi
            if [ -n "$NUMBER" ]; then
              RECOVERED=$(printf '流水线已恢复。\n\n- Run: %s\n- 结果: %s\n- 时间(UTC): %s\n' \
                "$RUN_URL" "$RESULTS" "$(date -u +%Y-%m-%dT%H:%M:%SZ)")
              gh issue close "$NUMBER" --comment "$RECOVERED"
              echo "已评论并关闭告警 Issue #$NUMBER"
            else
              echo "无失败/取消的 job，且无开放告警 Issue"
            fi
            exit 0
          fi
          BODY=$(printf '流水线失败，请检查。\n\n- Run: %s\n- 触发: %s @ %s\n- 结果: %s\n- 失败步骤:\n%s\n- 时间(UTC): %s\n' \
            "$RUN_URL" "$EVENT_NAME" "$SHA" "$RESULTS" "$FAILED_STEPS" "$(date -u +%Y-%m-%dT%H:%M:%SZ)")
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body "$BODY"
            echo "已评论既有告警 Issue #$NUMBER"
          else
            gh issue create --title "$TITLE" --body "$BODY"
            echo "已创建告警 Issue"
          fi
