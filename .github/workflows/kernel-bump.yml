name: "Mihomo 内核自动升级"

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: default-branch-write
  cancel-in-progress: false

jobs:
  prepare:
    name: "校验内核并产出钉扎值"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 设置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: 安装依赖
        run: pip install --require-hashes -r requirements.lock
      - name: 检查并升级内核钉扎
        id: bump
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python3 scripts/convert_mrs.py --bump-config
      - name: 上传待提交的 config.yaml
        if: steps.bump.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: bumped-config
          path: config.yaml
          retention-days: 1

  commit:
    name: "提交内核钉扎"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 # zizmor: ignore[artipacked] 需要凭据推送 config.yaml
      - name: 下载 config.yaml
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: bumped-config
          path: .
      - name: 提交并推送
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.yaml
          if git diff --cached --quiet; then
            echo "config.yaml 无变化，跳过"
            exit 0
          fi
          git commit -m "chore: mihomo 内核升级到 ${TAG}"
          git pull --rebase origin "${REF_NAME}"
          git push
