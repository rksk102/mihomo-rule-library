name: "安全扫描"

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: security-scan
  cancel-in-progress: false

jobs:
  osv-scanner:
    name: "OSV 依赖漏洞扫描"
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6ad84ce1ef2d4124ba333b221894c133c4a970ea  # v2.7.0
    with:
      scan-args: |-
        --lockfile=uv.lock
        --config=osv-scanner.toml
      fail-on-vuln: true
      upload-sarif: true
