network:
  timeout_seconds: 15
  max_retries: 2
  max_source_bytes: 67108864
  max_concurrency: 6
  max_per_host: 2
  max_retry_after_seconds: 60

paths:
  sources_file: "sources.urls"
  rulesets_dir: "rulesets"
  merged_output_dir: "merged-rules"
  mrs_output_dir: "merged-rules-mrs"
  log_dir: "logs"

merges:
  - strategy: "block"
    type: "domain"
    owner: "rksk102"
    filename: "all-adblock.txt"
    description: "合并多个广告拦截列表"
    inputs:
      - "block/domain/DustinWin/ads.txt"
      - "block/domain/MetaCubeX/category-ads-all.txt"
      - "block/domain/Loyalsoldier/reject-list.txt"

  - strategy: "direct"
    type: "ipcidr"
    owner: "rksk102"
    filename: "all-cnip.txt"
    description: "所有直连 CN IP 段"
    inputs:
      - "direct/ipcidr/Loyalsoldier/cncidr.txt"
      - "direct/ipcidr/MetaCubeX/cn.txt"

  - strategy: "policy"
    type: "domain"
    owner: "rksk102"
    filename: "all-proxy.txt"
    description: "代理域名规则"
    inputs:
      - "policy/domain/Loyalsoldier/proxy.txt"
      - "policy/domain/Loyalsoldier/proxy-list.txt"

behavior:
  # 产物哈希与上次发布一致时跳过发布
  release_change_detection: true
  # 旧 Release 保留天数；上限 90（清理每次最多读 200 条 release，每日 2 轮）
  release_keep_days: 30
  # 跨策略冲突处理：ignore | warn | fail
  conflict_policy: "warn"
  # 单输出组未识别行占比达到或超过该值时记 parse 错误（疑似上游格式变更）
  unrecognized_warn_ratio: 0.10
  # 输出组成功率门禁；0.0 = 禁用（fail-closed 模式下由 allow_partial 兜底）
  min_source_success_ratio: 0.0
  # false = 任一源下载/解析失败即整轮不发布（保留上一版产物）
  allow_partial: false
mihomo:
  kernel_cache_path: ".cache/mihomo-kernel"
  repo_api: "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"
  pinned_version: "v1.19.33"
  kernel_sha256: "09c2cb429cf45fb56884ceb91a0e5b17cc8b2c866c07811bcf75dfb59fef7662"
  kernel_sha256_arm64: "8c73570d9a5f388bc2f58eee0b347ccfab84fb3cf1a0f8f2cf5eac7005fbcdc0"
