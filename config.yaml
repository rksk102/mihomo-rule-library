network:
  timeout_seconds: 15
  max_retries: 2

paths:
  sources_file: "sources.urls"
  rulesets_dir: "rulesets"
  merged_output_dir: "merged-rules"
  mrs_output_dir: "merged-rules-mrs"
  cache_dir: ".cache"
  log_dir: "logs"

merges:
  - strategy: "block"
    type: "domain"
    owner: "rksk102"
    filename: "all-adblock.txt"
    description: "合并多个广告拦截列表"
    inputs:
      - "block/domain/DustinWin/ads.txt"
      - "block/domain/MetaCubeX/category-ads-all.txt"
      - "block/domain/Loyalsoldier/reject-list.txt"

  - strategy: "direct"
    type: "ipcidr"
    owner: "rksk102"
    filename: "all-cnip.txt"
    description: "所有直连cnipcidr"
    inputs:
      - "direct/ipcidr/Loyalsoldier/cncidr.txt"
      - "direct/ipcidr/MetaCubeX/cn.txt"

  - strategy: "policy"
    type: "domain"
    owner: "rksk102"
    filename: "all-proxy.txt"
    description: "代理域名规则"
    inputs:
      - "policy/domain/Loyalsoldier/proxy.txt"
      - "policy/domain/Loyalsoldier/proxy-list.txt"

behavior:
  # 仅控制任一源失败时是否让同步步骤退出，与域名去重无关
  strict_mode: false
  release_change_detection: true
  release_keep_days: 3
  # 跨策略冲突处理: ignore(不检查) | warn(仅告警) | fail(中断)
  # 注意：当前隐式冲突基线噪声较大，启用 fail 前请先人工核对检测结果。
  conflict_policy: "warn"

mihomo:
  kernel_cache_path: ".cache/mihomo-kernel"
  repo_api: "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"
  # 钉扎版本；留空才跟随 latest（不推荐）。安全更新需手动 bump 并重填 asset_name/kernel_sha256。
  pinned_version: "v1.19.30"
  # 精确资产名，消除"按 API 顺序取第一个"的不确定性
  asset_name: "mihomo-linux-amd64-v1.19.30.gz"
  # 解压后二进制的 sha256（用 `python scripts/convert_mrs.py --print-kernel-hash` 生成）
  kernel_sha256: "3e92df24f5e80e86b9cf9183ceb7bb575f0bd132a9dc4081dae42e80f21076ae"
