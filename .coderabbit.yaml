# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: zh-CN

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  poem: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
    ignore_title_keywords:
      - "chore: 自动更新规则"
      - "chore: 更新发布哈希"
      - "docs: 自动更新 README"

  path_filters:
    - "!merged-rules/**"
    - "!merged-rules-mrs/**"
    - "!rulesets/**"
    - "!state/**"
    - "!README.md"
    - "!AUDIT-REPORT*.md"
    - "!logs/**"
    - "!.cache/**"
    - "!.tools/**"
    - "!__pycache__/**"
    - "!**/__pycache__/**"
    - "!**/*.pyc"
    - "!*.zip"
    - "!.gitignore"
    - "!.mimosa/**"

  path_instructions:
    - path: "scripts/processor.py"
      instructions: |
        规则集四种写法匹配集不同，不可互换：`+.d`=d 及全部子域；`.d`=仅子域；裸 `d`=仅主机名；
        `*.d`=恰一级子域（`*` 必须独占整个标签）。`*.d`/`*.*.d` 须原样透传。
        任何被丢弃的行必须落入 new_stats() 的具名计数器。
        classical 规则必须先经 classify_rule_line 路由，再进域名清洗。
        `DOMAIN-KEYWORD,`/`regexp:` 之类负载不得当作域名输出。

    - path: "scripts/utils.py"
      instructions: |
        DomainTrie 的 SUFFIX(`+.d`)/SUBDOMAIN(`.d`)/EXACT(`d`) 语义见 processor 说明；
        只有 SUFFIX 有覆盖能力，`.d` 与裸 `d` 匹配集不相交。
        判定用 has_marked_ancestor（含自身），covering_parent 只返回严格祖先。
        clean_directory 必须返回未清理条目；flatten_ip_cidr 丢弃 /0 是有意为之。

    - path: "scripts/main.py"
      instructions: |
        产物必须「原子写 + 登记来源」，任何路径都不得静默消失。
        未识别行占比超过 unrecognized_warn_ratio 且达到绝对下限时必须记入 parse_errors。
        Authorization 只发给 is_trusted_host 白名单内的 GitHub 系主机。
        重试须尊重 Retry-After 并受 MAX_RETRY_AFTER 与退避预算封顶；408/425/429/5xx 可重试，
        其余 4xx 不可；等待不得占用 per-host 连接名额。
        输出路径跨来源冲突必须消歧且不与既有路径撞车。

    - path: "scripts/convert_mrs.py"
      instructions: |
        内核执行前必须完成校验：压缩流比对 asset.digest（digest 来自 GitHub API 对该资产的记录，
        即独立锚点；压缩流既已对上，解压后内容即被传递性锚定）、解压后比对 config.yaml 里 pin 的
        kernel_sha256。「无哈希也可执行」属缺陷，require_sha=True 不得被削弱。
        --bump-config 首次引入新版本时尚无 pin 可对，此时禁止用刚算出的哈希自我比对；
        新哈希由 kernel-bump.yml 的 commit job 直接提交到 main（无 PR 评审，且该 push 不触发 CI），
        下一次运行才走固定哈希路径；信任锚是上游 asset.digest 与本仓库 kernel_sha256 的组合，
        如需人工把关请禁用该 workflow 的 commit job。
        转换子进程必须有超时，失败必须让本轮退出码非零。

    - path: "scripts/merger.py"
      instructions: |
        合并去重遵循上述 SUFFIX/EXACT 语义；产物头部必须透传全部 `# Sources:`。
        产出数量硬校验（成功+跳过 != 期望即失败）不得移除；
        合并结果为空、或合并任务与自动透传输出同路径，必须 fail-closed。

    - path: "scripts/release_handler.py"
      instructions: |
        Release 标签为 rules-YYYY-MM-DD，同日重复运行是原地更新。
        gh CLI 不可用时必须显式失败；发布后必须确认 Release 至少有一个资产。
        产物校验不依赖 release_change_detection 开关。

    - path: "tests/**"
      instructions: |
        断言必须与实现语义一致，且不得引用不存在的路径；永远为真的断言等于没有断言。
        需要临时目录时优先用 conftest 的 work_dir fixture。
        新增丢弃行为应同步扩展 TestNoSilentDrop。

    - path: ".github/workflows/**"
      instructions: |
        第三方 action 必须钉 40 位 commit SHA 并保留同行 `# vX.Y.Z`（Dependabot 依赖该标注）；
        docker:// 镜像按 digest 固定。
          本仓库动作引用暂不使用 `$/` 自仓库语法（actionlint 1.7.12 尚不支持），待上游支持后再切换。
        执行下载来的二进制的 job 不得同时持有 contents: write。
        gh pr merge 必须带 --match-head-commit 且对空值 fail-closed。
        不得向 main 提交 merged-rules/ 或 merged-rules-mrs/。

  tools:
    # CI 已用受控的 .ruff.toml 自行 lint，此处关闭以免重复且口径不一
    ruff:
      enabled: false
    markdownlint:
      enabled: false
    yamllint:
      enabled: false
    # actionlint 与 CI 的 workflows-lint 完全重复（CI 钉扎同一版本），此处只留 zizmor 作第二意见
    actionlint:
      enabled: false
    zizmor:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: local
  code_guidelines:
    enabled: true
    filePatterns:
      - "README.md"
